<!DOCTYPE html>
<html>
<head>
  <title>Layout Boxes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">

    <header class="box red"></header>
    <nav class="box cyan"></nav>

    <article class="middle">
      <figure class="left">
        <p class="box yellow"></p>
        <p class="box orange"></p>
      </figure>
      <aside class="box pink"></aside>
    </article>

    <footer class="box gray"></footer>

  </main>
</body>
</html>
